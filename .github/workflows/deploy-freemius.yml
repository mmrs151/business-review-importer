name: Deploy to Freemius

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 2026.05.26)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ramsey/composer-install@v3
        with:
          composer-options: '--no-dev --optimize-autoloader'

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin ZIP
        run: |
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='tests' --exclude='phpunit.xml' --exclude='composer.json' \
            --exclude='composer.lock' --exclude='package.json' --exclude='package-lock.json' \
            --exclude='.gitignore' --exclude='*.md' \
            . /tmp/business-review-importer/
          cd /tmp && zip -r "$GITHUB_WORKSPACE/business-review-importer.zip" business-review-importer/

      - name: Deploy to Freemius
        uses: buttonizer/freemius-deploy@v0.1.3
        with:
          file_name: business-review-importer.zip
          release_mode: pending
          version: ${{ steps.version.outputs.version }}
          sandbox: false
        env:
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          DEV_ID: ${{ secrets.FREEMIUS_DEV_ID }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          PLUGIN_SLUG: business-review-importer
          PLUGIN_ID: '30507'
